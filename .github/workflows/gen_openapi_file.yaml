name: Generate openapi.json

on:
  pull_request: # Run on all PRs
  workflow_dispatch: # Allow to run manually
  push:
    branches: [main, develop] # Run for any commit on the main branches

jobs:
  generate-open-api-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HEAD rev
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          path: head

      - name: Check out BASE rev
        uses: actions/checkout@v3
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20" # Specify the version of Node.js you want to use

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: head
        run: pnpm install --frozen-lockfile

      - name: Set API URL
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "API_URL=https://api.adamik.io" >> $GITHUB_ENV
          else
            echo "API_URL=https://api-staging.adamik.io" >> $GITHUB_ENV
          fi

      - name: Run script to generate OpenAPI docs
        working-directory: head
        env:
          API_URL: ${{ env.API_URL }}
        run: pnpm run doc:openapi

      - name: Configure git
        working-directory: head
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # FIXME This doesn't work for direct pushes on main branches,
      # because instead of comparing with another branch we need to compare with HEAD of the same branch...
      - name: Check for Changes
        id: check_changes
        working-directory: head
        run: |
          if [[ -n "$(git diff --exit-code public/openapi.json)" ]]; then
            echo "Changes detected."
            echo "openapi_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected."
            echo "openapi_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Running OpenAPI Spec diff action
        if: steps.check_changes.outputs.openapi_changed == 'true'
        id: changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: base/public/openapi.json
          revision: head/public/openapi.json

      - name: Comment on PR
        if: steps.check_changes.outputs.openapi_changed == 'true' && github.event_name == 'pull_request'
        working-directory: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: 'gh pr comment ${{github.event.number}} --body "OpenAPI Comparison results: ${{steps.changes.outputs.breaking}}"'

      - name: Commit changes
        if: steps.check_changes.outputs.openapi_changed == 'true'
        working-directory: head
        run: |
          git add public/openapi.json
          git commit -m "Update OpenAPI JSON docs" || echo "No changes to commit"

      - name: Push changes
        if: steps.check_changes.outputs.openapi_changed == 'true'
        working-directory: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push || echo "No changes to push"
