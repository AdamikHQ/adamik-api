on:
  pull_request:
  workflow_dispatch:

name: validate-schema-changes
jobs:
  detect-breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BASE rev
        uses: actions/checkout@v2
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Check out HEAD rev
        uses: actions/checkout@v2
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Specify the version of Node.js you want to use
  
      - name: Install pnpm
        run: npm install -g pnpm
  
      - name: Change working directory to HEAD
        run: cd head

      - name: Install dependencies
        run: pnpm install
  
      - name: Run script
        run: pnpm run doc:openapi
    
      - name: "Run breaking change check (with OpenAPITools/openapi-diff)"
        id: diff_state
        uses: swimmwatch/openapi-diff-action@v1.0.0
        with:
          old-spec: base/public/openapi.json
          new-spec: head/public/openapi.json
          json: "diff.json"
          markdown: "diff.md"
          text: "diff.txt"