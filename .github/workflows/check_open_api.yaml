name: generate-open-api-docs-and-validate-schema-changes

on:
  pull_request:
  workflow_dispatch:

jobs:
  generate-open-api-docs-and-validate-schema-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: iterative/setup-cml@v2
      - name: Check out BASE rev
        uses: actions/checkout@v3
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Check out HEAD rev
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          path: head

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Specify the version of Node.js you want to use
  
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: head
        run: pnpm install
  
      - name: Run script to generate OpenAPI docs
        working-directory: head
        run: pnpm run doc:openapi

      - name: Check for changes
        working-directory: head
        run: git diff --exit-code >> /dev/null || echo "Changes detected"

      - name: Install Optic
        run: pnpm install @useoptic/optic

      - name: Run Optic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm optic diff --check base/public/openapi.json head/public/new_open_api.json > $GITHUB_STEP_SUMMARY