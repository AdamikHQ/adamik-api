on:
  pull_request:
  workflow_dispatch:

name: generate-open-api-docs-and-validate-schema-changes
jobs:
  generate-open-api-docs-and-validate-schema-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BASE rev
        uses: actions/checkout@v2
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Check out HEAD rev
        uses: actions/checkout@v2
        with:
          ref: ${{ github.head_ref }}
          path: head

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Specify the version of Node.js you want to use
  
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: head
        run: pnpm install
  
      - name: Run script to generate OpenAPI docs
        working-directory: head
        run: pnpm run doc:openapi

      - name: Check for changes
        working-directory: head
        run: git diff --exit-code >> /dev/null || echo "Changes detected"

      - name: Check for files
        run: ls -a head/public/openapi.json base/public/openapi.json || echo "No files found"

      - name: "Run breaking change check (with OpenAPITools/openapi-diff)"
        id: diff_state
        uses: swimmwatch/openapi-diff-action@v1.0.0
        with:
          old-spec: base/public/openapi.json
          new-spec: head/public/openapi.json
          json: "diff.json"
          markdown: "diff.md"
          text: "diff.txt"