name: generate-open-api-docs-and-validate-schema-changes

on:
  pull_request:
  workflow_dispatch:

jobs:
  generate-open-api-docs-and-validate-schema-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BASE rev
        uses: actions/checkout@v3
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Check out HEAD rev
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          path: head

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Specify the version of Node.js you want to use
  
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: head
        run: pnpm install --frozen-lockfile
  
      - name: Run script to generate OpenAPI docs
        working-directory: head
        run: pnpm run doc:openapi

      - name: Check for changes
        working-directory: head
        run: git diff --exit-code || echo "Changes detected"

        # TODO: run only if there are changes
      - name: Running OpenAPI Spec diff action
        id: changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: base/public/openapi.json
          revision: head/public/openapi.json

      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: head
        run: "gh pr comment ${{github.event.number}} --body \"OpenAPI Comparison results: ${{steps.changes.outputs.breaking}}\""

      - name: Configure git
        working-directory: head
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit changes
        working-directory: head
        run: |
          git add public/openapi.json
          git commit -m "Update OpenAPI JSON docs" || echo "No changes to commit"

      - name: Push changes
        working-directory: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push || echo "No changes to push"