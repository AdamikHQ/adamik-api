name: Bruno API tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: run Adamik API
        run: pnpm run dev > output.txt &
        env:
          EDGE_CONFIG: ${{ secrets.EDGE_CONFIG }}
          ENABLE_MSW: true
      - name: Create configuration file
        env:
          ADAMIK_TESTS_API_KEY: ${{ secrets.ADAMIK_TESTS_API_KEY }}
        run: |
          echo "vars {
            api_key: ${{ env.ADAMIK_TESTS_API_KEY }}
            api_url: http://localhost:3000
          }" > ./bruno/environments/ci.bru
      - name: run tests
        run: |
          cat ./bruno/environments/ci.bru
          sleep 5
          pnpm run test:bruno:ci
      - name: Get current date
        id: date
        run: |
          echo "date={$(date +'%Y-%m-%dT%H:%M:%S')}" >> $GITHUB_STATE
      - uses: actions/upload-artifact@v4
        with:
          name: adamik-test-output-${{ env.date }}
          path: output.txt
