name: Generate Providers.md

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  run-script-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMIT_KEY }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Specify the version of Node.js you want to use

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run script
        run: pnpm run doc:providers

      - name: Check for changes
        run: git diff --exit-code || echo "Changes detected"

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit changes
        run: |
          git add doc/.
          git commit -m "Update Providers Doc" || echo "No changes to commit"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.COMMIT_KEY }}
        run: |
          git push || echo "No changes to push"
