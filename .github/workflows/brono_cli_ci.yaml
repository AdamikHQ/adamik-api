name: bruno cli CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: run Adamik API
        run: pnpm run dev &
        env:
          EDGE_CONFIG: https://edge-config.vercel.com/ecfg_e4jkpjfbg0qae9h1gqdysstq4elo?token=d448b041-36d8-44e2-a672-fc19e86308e1
      - name: Create configuration file
        env:
          ADAMIK_TESTS_API_KEY: ${{ secrets.SuperSecret }}
        run: |
          echo "vars {
            api_key: \"${{ env.ADAMIK_TESTS_API_KEY }}\"
            api_url: http://localhost:3000
          }" > ./bruno/environments/ci.bru
      - name: run tests
        run: |
          cat ./bruno/environments/ci.bru
          sleep 5
          pnpm run ci:bruno:test
