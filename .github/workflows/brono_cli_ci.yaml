name: bruno cli CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: run Adamik API
        run: pnpm run dev &
        env:
          EDGE_CONFIG: https://edge-config.vercel.com/ecfg_e4jkpjfbg0qae9h1gqdysstq4elo?token=d448b041-36d8-44e2-a672-fc19e86308e1
      - name: Create and populate .Renviron file
        run: |
          touch ./bruno/environments/ci.bru
          echo "vars {" >> ./bruno/environments/ci.bru
          echo "  api_key: \"${{ secrets.ADAMIK_TESTS_API_KEY }}\"" >> ./bruno/environments/ci.bru
          echo "  api_url: http://localhost:3000" >> ./bruno/environments/ci.bru
          echo "}" >> ./bruno/environments/ci.bru
      - name: run tests
        run: |
          sleep 5
          pnpm run ci:bruno:test
