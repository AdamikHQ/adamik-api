openapi: 3.1.0
info:
  title: Adamik
  version: 1.0.0
  description: A simple demo for zod-openapi
  license:
    name: MIT
security:
  - s2sauth: []
paths:
  /api/data/state:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chainId:
                  type: string
                  minLength: 1
                address:
                  type: string
                  minLength: 1
              required:
                - chainId
                - address
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:
                    type: object
                    properties:
                      available:
                        type: string
                    required:
                      - available
                required:
                  - balances
components:
  securitySchemes: {}
